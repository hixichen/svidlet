[workspace]
resolver = "2"
members = ["crates/svidlet", "crates/svidlet-issue", "crates/svidlet-broker"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/hixichen/svidlet"

[workspace.dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
base64 = "0.23"
basic-toml = "0.1"
libc = "0.2"
ring = "0.17"
prost = "0.14"
regex-lite = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "signal", "io-util", "sync"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
tokio-stream = { version = "0.1", default-features = false, features = ["net", "sync"] }
tonic = { version = "0.14", default-features = false, features = ["server", "router", "codegen", "channel", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
x509-parser = { version = "0.18", features = ["verify"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Debug builds keep line tables (backtraces with file:line) but not full debug
# info: that is most of target/'s size and none of what a test failure needs.
# Dependencies keep none at all. Tests inherit this profile.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
