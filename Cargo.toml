[workspace]
resolver = "2"
members = ["crates/svidlet", "crates/svidlet-issue"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/hixichen/svidlet"
readme = "README.md"
keywords = ["spiffe", "kubernetes", "csi", "vault", "mtls"]
categories = ["authentication", "cryptography"]
rust-version = "1.88"

[workspace.dependencies]
svidlet-issue = { path = "crates/svidlet-issue", version = "0.0.1" }
base64 = "0.23"
basic-toml = "0.1"
libc = "0.2"
ring = "0.17"
prost = "0.14"
regex-lite = "0.1"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "net", "time", "signal", "io-util", "sync"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "registry"] }
tokio-stream = { version = "0.1", default-features = false, features = ["net", "sync"] }
tonic = { version = "0.14", default-features = false, features = ["server", "router", "codegen", "channel", "tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
x509-parser = { version = "0.18", features = ["verify"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
literal_string_with_formatting_args = "allow"
# Transitive: tonic, ureq and rcgen pull different majors of base64, syn and
# windows-sys. Nothing in this workspace can unify them.
multiple_crate_versions = "allow"
# Every such cast feeds a Prometheus sample, which is an f64 by definition;
# the counts and seconds involved stay far below 2^52.
cast_precision_loss = "allow"
