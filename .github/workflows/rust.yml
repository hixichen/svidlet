name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --all-targets
    - name: Run tests
      # The plugin's tests mount real tmpfs and bind mounts, as it does on a
      # node, and mounting needs root. Built above as the runner user; only
      # the test run is elevated.
      run: sudo -E env "PATH=$PATH" cargo test --verbose
