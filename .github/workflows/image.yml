name: Image

# The release image: a static musl build of every binary on scratch. Built only
# when something that goes into it changes, because an LTO release build is
# the slowest thing this repository does.
on:
  push:
    branches: [ "main" ]
    paths: [ "Dockerfile", "Cargo.toml", "Cargo.lock", "crates/**", ".github/workflows/image.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "Dockerfile", "Cargo.toml", "Cargo.lock", "crates/**", ".github/workflows/image.yml" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Build
      run: docker build -t svidlet:ci .
    - name: Every binary is in the image and runs
      run: |
        # No shell in a scratch image: create a container and copy out.
        id=$(docker create svidlet:ci)
        mkdir out
        for bin in svidlet svidlet-policy svidlet-broker oidc-publisher svidlet-catalog; do
          docker cp "$id:/$bin" "out/$bin"
        done
        docker rm "$id"
        file out/*
        ls -l out
        # Static and self-contained: the catalog tool runs on the host as is.
        ./out/svidlet-catalog lint deploy/broker/catalog.toml
