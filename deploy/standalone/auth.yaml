apiVersion: v1
kind: ConfigMap
metadata:
  name: svidlet
  namespace: svidlet-system
data:
  SVIDLET_VAULT_AUTH: kubernetes
  # One Kubernetes auth mount per cluster, because each cluster has its own
  # API server and signing keys. vault-bootstrap.sh names it after the cluster.
  SVIDLET_VAULT_K8S_MOUNT: kubernetes-cluster-a
  SVIDLET_VAULT_K8S_ROLE: svidlet
