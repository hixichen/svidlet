apiVersion: v1
kind: Namespace
metadata:
  name: svidlet-system
  labels:
    # The plugin needs CAP_SYS_ADMIN to mount tmpfs; tenant workloads that
    # consume its certificates do not, and stay under restricted PSS.
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: svidlet
  namespace: svidlet-system
# Deliberately no Role, RoleBinding or ClusterRole: svidlet never talks to the
# API server. Issuance is one HTTPS call to the PKI backend.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: svidlet
  namespace: svidlet-system
data:
  SVIDLET_TRUST_DOMAIN: example.org
  SVIDLET_CLUSTER: cluster-a
  SVIDLET_LOG_LEVEL: info
  # Group that owns tls.key, which is mode 0640. Must match the workload's
  # runAsGroup or a non-root workload cannot read its own key. See
  # docs/USAGE.md; do not "fix" a permission error by widening SVIDLET_KEY_MODE.
  SVIDLET_KEY_GID: "1000"

  # Shape of every SPIFFE ID this node issues. The cluster lives in the path,
  # not the trust domain, so cross-cluster mTLS needs no federation.
  # Placeholders: trust_domain, cluster, namespace, service_account,
  # pod_name, pod_uid, node_name.
  SVIDLET_SPIFFE_ID_TEMPLATE: "spiffe://{trust_domain}/cluster/{cluster}/ns/{namespace}/sa/{service_account}"
  # An independent second gate. The template says what svidlet builds; this says
  # what it is allowed to build. Anchored on both ends.
  # SVIDLET_SPIFFE_ID_PATTERN: "spiffe://example\\.org/cluster/cluster-a/ns/(payments|billing)/sa/.+"

  VAULT_ADDR: https://vault.example.internal:8200
  SVIDLET_PKI_MOUNT: pki
  # Defaults to spiffe-$SVIDLET_CLUSTER.
  SVIDLET_PKI_ROLE: spiffe-cluster-a

  # How the node authenticates to Vault is the one thing the overlays decide:
  #
  #   deploy/standalone           kubernetes — svidlet alone; Vault verifies the
  #                               plugin's own ServiceAccount token
  #   deploy/with-node-bootstrap  cert — svidlet-node-bootstrap attests the node
  #                               and hands svidlet a node certificate
  #   deploy/dev                  approle — kind and local clusters only
  #
  # See docs/DEPLOY.md. Everything else in this ConfigMap is shared.

  # Pod certificates. Six hours by default; the Subject CN is the pod name,
  # which AWS IAM Roles Anywhere requires and records as sourceIdentity.
  # SVIDLET_CERT_TTL: 6h
  # SVIDLET_CERT_SUBJECT: pod_name
  # Check every issued certificate against the clouds it will be exchanged
  # with, and count what they would refuse in
  # svidlet_cloud_profile_findings_total. Never blocks issuance.
  # SVIDLET_CLOUD_PROFILE: aws,gcp

  # ---- read by the svidlet-policy container only ----
  #
  # Policy distribution runs as a separate process with separate credentials:
  # it never sees the node certificate or any Vault credential, and it does not run as
  # root. See docs/DESIGN.md, "Two processes, one volume".
  #
  # Authorization policy, streamed from a backend fronting a git repository.
  # Leave the endpoint unset to disable: no stream is opened and no policy
  # directory is written. Mutually exclusive with SVIDLET_BUNDLE_ROLLOUT_REF
  # below: the stream is transport-trusted while bundles are signed, and one
  # node never answers to both.
  # SVIDLET_POLICY_ENDPOINT: https://policy.example.internal:9000
  #
  # The master switch. Setting this to "false" ignores the endpoint above
  # entirely — no stream, no subscriptions, no waiting — while leaving the rest
  # of this ConfigMap alone. Use it for local runs, and to take the policy
  # backend out of the picture when narrowing down a problem.
  SVIDLET_POLICY_ENABLED: "true"
  # Read by svidlet, not by svidlet-policy: whether a pod may start before the
  # policy daemon has written a bundle into its volume. Off means a
  # policy-backend outage still lets certificates be issued.
  # SVIDLET_POLICY_REQUIRED: "false"
  # The group that may write the policy chain into a published volume. Must
  # match the svidlet-policy container's runAsGroup, or it cannot write — and
  # must differ from SVIDLET_KEY_GID, or the daemon could read every tls.key
  # on the node (svidlet refuses to start if they are equal).
  SVIDLET_POLICY_GID: "2000"
  # SVIDLET_POLICY_INITIAL_TIMEOUT: 10s

  # Or pull policy as signed, content-addressed OCI bundles with a staged ring
  # rollout — see ../svidlet-policy/authz-management-plane.md. Setting the rollout reference switches
  # this on (and is mutually exclusive with SVIDLET_POLICY_ENDPOINT above); a
  # trusted public key is then mandatory, and the plugin refuses to start
  # without one rather than run unable to verify anything.
  # SVIDLET_BUNDLE_ROLLOUT_REF: registry.example.internal/policy/rollout:current
  # SVIDLET_BUNDLE_PUBLIC_KEY_FILE: /etc/svidlet/bundle/signing.pub
  # SVIDLET_BUNDLE_POLL_INTERVAL: 60s
  # SVIDLET_BUNDLE_POLL_JITTER: 30s
  # Superseded versions kept unpacked, so a rollback needs no registry.
  # SVIDLET_BUNDLE_KEEP_VERSIONS: "2"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: svidlet
  namespace: svidlet-system
  labels:
    app.kubernetes.io/name: svidlet
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: svidlet
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      # A restart adopts existing certificates instead of re-issuing them, so a
      # fast rollout does not create a signing storm — but a slower one still
      # limits how many nodes are briefly unable to serve new pods.
      maxUnavailable: 10%
  template:
    metadata:
      labels:
        app.kubernetes.io/name: svidlet
    spec:
      serviceAccountName: svidlet
      priorityClassName: system-node-critical
      hostNetwork: false
      tolerations:
        - operator: Exists
      containers:
        - name: svidlet
          image: ghcr.io/hixichen/svidlet:0.0.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: svidlet
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: metrics
              containerPort: 9464
          securityContext:
            # Required to mount a tmpfs per volume and to propagate that mount
            # back to the kubelet. This is the same privilege every CSI node
            # plugin needs.
            privileged: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: kubelet-dir
              mountPath: /var/lib/kubelet
              # Bidirectional so the tmpfs svidlet mounts inside a pod's volume
              # directory is visible to the kubelet and to the workload.
              mountPropagation: Bidirectional
            - name: volumes-farm
              mountPath: /var/lib/svidlet/volumes
              # Bidirectional so the per-volume bind mounts svidlet creates here
              # propagate to the host and into the svidlet-policy container.
              mountPropagation: Bidirectional
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 20
            # Liveness is not tied to the PKI backend: a Vault outage must not
            # restart nodes whose certificates are still valid for hours.
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              # Measured on Linux: 5.4 MB idle, 7.7 MB with 2000 certificates.
              memory: 24Mi
            limits:
              memory: 48Mi
        # Policy distribution, deliberately a separate process. It holds no
        # Vault credential, needs no capabilities, and cannot mint an identity.
        # It mounts only the exposure farm — not the kubelet root — so a
        # compromise cannot read other pods' secret volumes, and its group
        # (2000) differs from SVIDLET_KEY_GID, so it cannot read tls.key
        # either; the most it could do is write or delete policy files. Drop
        # this container entirely if you do not distribute policy.
        - name: svidlet-policy
          image: ghcr.io/hixichen/svidlet:0.0.1
          command: ["/svidlet-policy"]
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: svidlet
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: policy-metrics
              containerPort: 9465
          securityContext:
            # Everything svidlet needs and this does not: no privilege, no
            # capabilities, not root. The group must match SVIDLET_POLICY_GID
            # and differ from SVIDLET_KEY_GID.
            privileged: false
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # The exposure farm: one bind mount per published volume, created
            # by svidlet. This is the daemon's whole view of the node's
            # volumes — it never mounts the kubelet root, which would hand it
            # every secret volume on the node. HostToContainer, not
            # Bidirectional: it reads the mounts svidlet made and writes files
            # into them; it never mounts anything itself.
            - name: volumes-farm
              mountPath: /var/lib/svidlet/volumes
              mountPropagation: HostToContainer
            - name: bundle-cache
              mountPath: /var/lib/svidlet/policy
          livenessProbe:
            httpGet:
              path: /healthz
              port: policy-metrics
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              # Bundles are unpacked in this process, so it gets the headroom.
              memory: 64Mi
      volumes:
        - name: kubelet-dir
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: volumes-farm
          hostPath:
            path: /var/lib/svidlet/volumes
            type: DirectoryOrCreate
        - name: bundle-cache
          hostPath:
            path: /var/lib/svidlet/policy
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: svidlet-metrics
  namespace: svidlet-system
  labels:
    app.kubernetes.io/name: svidlet
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: svidlet
  ports:
    - name: metrics
      port: 9464
      targetPort: metrics
    - name: policy-metrics
      port: 9465
      targetPort: policy-metrics
