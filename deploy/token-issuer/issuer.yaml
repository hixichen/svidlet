apiVersion: v1
kind: ServiceAccount
metadata:
  name: svidlet-token-issuer
# The issuer never talks to the API server either.
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: svidlet-token-issuer
  labels:
    app.kubernetes.io/name: svidlet-token-issuer
spec:
  selector:
    app.kubernetes.io/name: svidlet-token-issuer
  ports:
    # svidlet mints here: gRPC, mutual TLS, node certificates only.
    - name: grpc
      port: 8443
      targetPort: grpc
    # Discovery and JWKS. Plain HTTP: expose it at the issuer URL through an
    # ingress or load balancer that terminates TLS. Nothing secret is served.
    - name: public
      port: 8080
      targetPort: public
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: svidlet-token-issuer
  labels:
    app.kubernetes.io/name: svidlet-token-issuer
spec:
  # Stateless: every replica holds the same keys and grants, and svidlet
  # retries on another connection. Two keep minting through a node drain.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: svidlet-token-issuer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: svidlet-token-issuer
    spec:
      serviceAccountName: svidlet-token-issuer
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # Secret files are root-owned; the group is how a non-root process
        # reads the keys.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: issuer
          image: ghcr.io/hixichen/svidlet-token-issuer:0.0.1
          imagePullPolicy: IfNotPresent
          args: ["serve", "/etc/token-issuer/config.toml"]
          ports:
            - name: grpc
              containerPort: 8443
            - name: public
              containerPort: 8080
            - name: metrics
              containerPort: 9466
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/token-issuer/config.toml
              subPath: config.toml
              readOnly: true
            - name: tls
              mountPath: /etc/token-issuer/tls
              readOnly: true
            - name: keys
              mountPath: /etc/token-issuer/keys
              readOnly: true
            - name: cas
              mountPath: /etc/token-issuer/cas
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: svidlet-token-issuer
        - name: tls
          secret:
            secretName: svidlet-token-issuer-tls
            defaultMode: 0440
        - name: keys
          secret:
            secretName: svidlet-token-issuer-keys
            defaultMode: 0440
        - name: cas
          configMap:
            name: svidlet-token-issuer-cas
