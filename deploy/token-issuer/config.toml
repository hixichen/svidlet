# The token issuer's configuration: crates/svidlet-token-issuer/src/config.rs
# documents every field. Replace the issuer URL and the grants.

# The `iss` claim. Discovery must be reachable at this URL from the clouds that
# verify the tokens: either route it to public_listen, or publish the output of
# `svidlet-token-issuer discovery` to static hosting there.
issuer = "https://tokens.example.org"
trust_domain = "example.org"
# Six hours, capped per token at the pod certificate's notAfter.
token_ttl_secs = 21600

listen = "0.0.0.0:8443"
public_listen = "0.0.0.0:8080"
metrics_listen = "0.0.0.0:9466"

server_cert = "/etc/token-issuer/tls/tls.crt"
server_key = "/etc/token-issuer/tls/tls.key"
node_ca = "/etc/token-issuer/cas/node-ca.pem"
pod_ca = "/etc/token-issuer/cas/pod-ca.pem"

# Rotation: add the next key with sign = false and wait out the verifiers'
# JWKS cache; flip it to sign = true and the old one to false; remove the old
# one once its last token (token_ttl_secs) has expired. Each step is a restart.
[[key]]
path = "/etc/token-issuer/keys/current.pem"
sign = true

# Which SPIFFE IDs may ask for which audiences. A prefix ending in "/" covers
# everything below it; otherwise the ID must match exactly. No wildcards, and
# every prefix names one cluster. Nothing is granted by default.
[[grant]]
prefix = "spiffe://example.org/cluster/cluster-a/ns/payments/"
audiences = ["api://AzureADTokenExchange"]
